<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso Profesores — CEDM Santa Teresa</title>
<style>
  body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#150E24; color:#F1ECFA; }
  .box { width:90%; max-width:340px; padding:28px; border-radius:14px; background:#1F1733; border:1px solid #3C2F58; }
  h1 { font-size:18px; margin:0 0 18px; text-align:center; }
  label { font-size:13px; color:#B9A9D9; display:block; margin-bottom:4px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:14px; border-radius:8px; border:1px solid #3C2F58; background:#150E24; color:#F1ECFA; font-size:14px; }
  button { width:100%; padding:11px; border:0; border-radius:8px; background:#8B5CF6; color:white; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #error { color:#fca5a5; font-size:13px; margin-top:12px; text-align:center; min-height:16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Acceso Profesores</h1>
    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Ingresar</button>
      <div id="error"></div>
    </form>
  </div>

<a href="../index.html">Inicio</a>

  <!-- SDK de Firebase (versión compat, simple, sin build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    // Si ya hay sesión activa, mandar directo a profesores.html
    firebase.auth().onAuthStateChanged(user => {
      if (user) window.location.href = 'profesores.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        window.location.href = 'profesores.html';
      } catch (err) {
        errorBox.textContent = mensajeError(err.code);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });

    function mensajeError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'El correo no es válido.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'Correo o contraseña incorrectos.';
        case 'auth/too-many-requests': return 'Demasiados intentos. Probá de nuevo en unos minutos.';
        default: return 'No se pudo iniciar sesión. Probá de nuevo.';
      }
    }
  </script>
</body>
</html>
