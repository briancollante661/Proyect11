<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Profesores — CEDM Santa Teresa de Ávila | SIE</title>
<link rel="icon" type="image/png" href="imagenes/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════
     SIE — SISTEMA DE INFORMACIÓN ESCOLAR
     Acceso Institucional — Rediseño Editorial & Arquitectónico (Modo Claro)
     Paleta Institucional:
       #59217C (Morado Principal)
       #A664BE (Lila Principal)
       #573C72 (Morado Secundario)
       #926D92 (Malva)
       #202040 (Azul Profundo)
       Fondos: #FFFFFF, #F8F5FC, #F0E8F6
     ═══════════════════════════════════════════════════════════════ */

  :root {
    --morado-principal:  #59217C;
    --lila-principal:    #A664BE;
    --morado-secundario: #573C72;
    --malva:             #926D92;
    --azul-texto:        #202040;

    --fondo-base:        #F8F5FC;
    --blanco:            #FFFFFF;
    --lila-suave:        #F0E8F6;
    --lila-tenue:        #EADFF3;

    --borde-tarjeta:     rgba(89, 33, 124, 0.10);
    --borde-input:       rgba(87, 60, 114, 0.16);
    --sombra-card:       0 24px 64px -14px rgba(89, 33, 124, 0.12), 0 8px 24px -6px rgba(89, 33, 124, 0.06);
    --sombra-btn:        0 8px 24px rgba(89, 33, 124, 0.28);
    --sombra-btn-hover:  0 12px 30px rgba(89, 33, 124, 0.38);

    --radio-card:        24px;
    --radio-input:       14px;
    --radio-pill:        9999px;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--fondo-base);
    color: var(--azul-texto);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ── LIENZO AMBIENTAL & EFECTOS DE FONDO ── */
  .ambient-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* Brillos etéreos difuminados en la paleta institucional */
  .ambient-glow-1 {
    position: absolute;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    top: -150px;
    left: -100px;
    background: radial-gradient(circle, rgba(166, 100, 190, 0.16) 0%, rgba(240, 232, 246, 0.05) 55%, transparent 75%);
    filter: blur(50px);
    animation: driftSlow 22s ease-in-out infinite alternate;
  }

  .ambient-glow-2 {
    position: absolute;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    bottom: -180px;
    right: -120px;
    background: radial-gradient(circle, rgba(89, 33, 124, 0.10) 0%, rgba(166, 100, 190, 0.06) 50%, transparent 75%);
    filter: blur(60px);
    animation: driftSlow 26s ease-in-out infinite alternate-reverse;
  }

  /* Sistema Orbital Gráfico de Identidad SIE */
  .ambient-orbits {
    position: absolute;
    top: 50%;
    left: 20%;
    transform: translate(-50%, -50%);
    width: 780px;
    height: 780px;
    pointer-events: none;
    opacity: 0.65;
  }

  .orbit-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px dashed rgba(166, 100, 190, 0.28);
    animation: rotateOrbit 90s linear infinite;
  }

  .orbit-ring-inner {
    inset: 120px;
    border-style: solid;
    border-color: rgba(89, 33, 124, 0.12);
    animation: rotateOrbit 60s linear infinite reverse;
  }

  .orbit-node {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--lila-principal);
    box-shadow: 0 0 14px rgba(166, 100, 190, 0.85);
  }

  /* Destellos característicos del SIE (Estrellitas de cuatro puntas) */
  .ambient-sparkle {
    position: absolute;
    pointer-events: none;
    color: var(--lila-principal);
    opacity: 0.7;
    filter: drop-shadow(0 0 6px rgba(166, 100, 190, 0.4));
    will-change: transform, opacity;
  }

  /* Distribución equilibrada en el atrio institucional izquierdo */
  .ambient-sparkle.s1  { top: 18%; left: 7%; width: 22px; height: 22px; color: var(--lila-principal); animation: sparkleGaze 4.5s ease-in-out infinite alternate; animation-delay: 0.2s; }
  .ambient-sparkle.s2  { bottom: 20%; left: 34%; width: 15px; height: 15px; color: var(--malva); animation: sparkleTwinkle 3.8s ease-in-out infinite; animation-delay: 1.2s; }
  .ambient-sparkle.s3  { top: 11%; right: 13%; width: 18px; height: 18px; color: #BFA0CD; animation: sparkleFloat 5s ease-in-out infinite alternate; animation-delay: 0.7s; }
  .ambient-sparkle.s4  { top: 9%; left: 22%; width: 13px; height: 13px; color: #A664BE; animation: sparkleTwinkle 3.4s ease-in-out infinite; animation-delay: 2.1s; }
  .ambient-sparkle.s5  { top: 29%; left: 4%; width: 17px; height: 17px; color: #9A6BA8; animation: sparkleFloat 4.8s ease-in-out infinite alternate; animation-delay: 1.6s; }
  .ambient-sparkle.s6  { top: 34%; left: 33%; width: 26px; height: 26px; color: var(--lila-principal); animation: sparkleGaze 5.2s ease-in-out infinite alternate; animation-delay: 0.9s; }
  .ambient-sparkle.s7  { top: 48%; left: 9%; width: 11px; height: 11px; color: var(--malva); animation: sparkleTwinkle 4.1s ease-in-out infinite; animation-delay: 2.7s; }
  .ambient-sparkle.s8  { top: 62%; left: 3%; width: 19px; height: 19px; color: #A664BE; animation: sparkleGaze 4.3s ease-in-out infinite alternate; animation-delay: 0.5s; }
  .ambient-sparkle.s9  { bottom: 13%; left: 13%; width: 21px; height: 21px; color: var(--lila-principal); animation: sparkleFloat 5.6s ease-in-out infinite alternate; animation-delay: 1.8s; }
  .ambient-sparkle.s10 { bottom: 27%; left: 46%; width: 12px; height: 12px; color: #B386C7; animation: sparkleTwinkle 3.6s ease-in-out infinite; animation-delay: 3.1s; }
  .ambient-sparkle.s11 { top: 76%; left: 24%; width: 14px; height: 14px; color: var(--malva); animation: sparkleGaze 4.9s ease-in-out infinite alternate; animation-delay: 2.4s; }

  /* ── CONTENEDOR MAESTRO ── */
  .portal-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 36px 24px;
  }

  .portal-stage {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    gap: 56px;
    align-items: center;
  }

  /* ── COLUMNA IZQUIERDA: ATRIO INSTITUCIONAL ── */
  .stage-intro {
    display: flex;
    flex-direction: column;
    gap: 24px;
    animation: entranceFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Botón de retorno al inicio */
  .return-nav {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    padding: 9px 18px;
    border-radius: var(--radio-pill);
    background: #521D75;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--borde-tarjeta);
    color: #FFFFFF;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 12px rgba(89, 33, 124, 0.04);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .return-nav svg {
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }

  .return-nav:hover {
    color: #FFFFFF;
    border-color: var(--lila-principal);
    background: #59217C;
    transform: translateX(-3px);
    box-shadow: 0 6px 18px rgba(89, 33, 124, 0.10);
  }

  .return-nav:hover svg {
    transform: translateX(-3px);
  }

  /* Escudo Institucional & Identidad */
  .institution-badge {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 2px;
  }

  .crest-frame {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(145deg, #FFFFFF, var(--lila-suave));
    padding: 6px;
    border: 1px solid rgba(166, 100, 190, 0.3);
    box-shadow: 0 10px 24px rgba(89, 33, 124, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .crest-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
  }

  .institution-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .institution-name {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--morado-principal);
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .institution-sub {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--malva);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* Pilares Académicos del SIE (Subidos junto al encabezado) */
  .feature-pillars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 440px;
  }

  .pillar-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(87, 60, 114, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(89, 33, 124, 0.03);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .pillar-card:hover {
    background: #FFFFFF;
    border-color: rgba(166, 100, 190, 0.35);
    transform: translateX(4px);
    box-shadow: 0 8px 24px rgba(89, 33, 124, 0.08);
  }

  .pillar-icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--lila-suave);
    color: var(--morado-principal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .pillar-icon-wrap svg {
    width: 20px;
    height: 20px;
  }

  .pillar-content h3 {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--azul-texto);
    margin-bottom: 2px;
  }

  .pillar-content p {
    font-size: 0.76rem;
    color: var(--malva);
    line-height: 1.4;
  }

  /* ── COLUMNA DERECHA: CONSOLA DE ACCESO (CARD) ── */
  .stage-auth {
    animation: entranceFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
  }

  .auth-card {
    position: relative;
    background: var(--blanco);
    border-radius: var(--radio-card);
    border: 1px solid var(--borde-tarjeta);
    box-shadow: var(--sombra-card);
    padding: 42px 38px 36px;
    overflow: hidden;
  }

  /* Línea superior ornamental de gradiente */
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--morado-principal) 0%, var(--lila-principal) 50%, var(--morado-secundario) 100%);
  }

  /* Cabecera del formulario */
  .auth-card-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
  }

  .auth-logo-badge {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--lila-suave) 0%, #FFFFFF 100%);
    border: 1.5px solid rgba(166, 100, 190, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 22px rgba(89, 33, 124, 0.10);
    padding: 10px;
  }

  .auth-logo-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .auth-card-header h1 {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--azul-texto);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .auth-card-header p {
    font-size: 0.82rem;
    color: var(--malva);
    max-width: 290px;
    line-height: 1.45;
  }

  /* Formulario y Campos */
  form#login-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }

  .field-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--morado-secundario);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .input-control-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 15px;
    color: var(--malva);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
  }

  .input-icon svg {
    width: 18px;
    height: 18px;
  }

  /* Campos de entrada con compatibilidad total */
  input#email,
  input#password {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--azul-texto);
    background-color: var(--fondo-base);
    border: 1.5px solid var(--borde-input);
    border-radius: var(--radio-input);
    outline: none;
    transition: all 0.22s ease;
    box-sizing: border-box;
  }

  input#password {
    padding-right: 44px;
  }

  input#email::placeholder,
  input#password::placeholder {
    color: rgba(146, 109, 146, 0.65);
    font-size: 0.86rem;
  }

  input#email:focus,
  input#password:focus {
    background-color: #FFFFFF;
    border-color: var(--lila-principal);
    box-shadow: 0 0 0 4px rgba(166, 100, 190, 0.16);
  }

  .input-control-wrap:focus-within .input-icon {
    color: var(--morado-principal);
  }

  /* Botón interactivo para alternar visibilidad de contraseña */
  .toggle-password-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: var(--malva);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
  }

  .toggle-password-btn:hover {
    color: var(--morado-principal);
    background-color: var(--lila-suave);
  }

  .toggle-password-btn:active {
    transform: scale(0.92);
  }

  .toggle-password-btn svg {
    width: 20px;
    height: 20px;
    transform-origin: center;
  }

  .toggle-password-btn svg.blinking {
    animation: eyeBlink 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes eyeBlink {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(0.08); opacity: 0.65; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  /* Botón Ingresar Oficial con Gradiente SIE */
  button#submit-btn {
    position: relative;
    width: 100%;
    height: 50px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--morado-principal) 0%, #7A359E 50%, var(--lila-principal) 100%);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radio-input);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: var(--sombra-btn);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  /* Brillo animado de alta gama en hover */
  button#submit-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transform: skewX(-22deg);
    transition: left 0.6s ease;
  }

  button#submit-btn:hover:not(:disabled)::after {
    left: 180%;
  }

  button#submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: var(--sombra-btn-hover);
    filter: brightness(1.04);
  }

  button#submit-btn:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 4px 14px rgba(89, 33, 124, 0.22);
  }

  button#submit-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Spinner animado cuando está en proceso */
  .btn-spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: rotateOrbit 0.8s linear infinite;
  }

  button#submit-btn.loading .btn-spinner {
    display: inline-block;
  }

  /* Contenedor de Error con Animación de Entrada */
  #error {
    font-size: 0.82rem;
    min-height: 0;
    text-align: center;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  #error.active {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    background-color: #FEF2F2;
    border: 1px solid #FECACA;
    color: #DC2626;
    animation: shakeError 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  /* Pie de la tarjeta: Soporte */
  .auth-card-footer {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--borde-tarjeta);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .auth-hint {
    font-size: 0.74rem;
    color: var(--malva);
    line-height: 1.4;
  }

  /* ── ANIMACIONES KEYFRAMES ── */
  @keyframes entranceFade {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes driftSlow {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 40px) scale(1.08); }
  }

  @keyframes rotateOrbit {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulseSparkle {
    0% { transform: scale(0.85) rotate(0deg); opacity: 0.4; }
    50% { transform: scale(1.15) rotate(15deg); opacity: 0.9; }
    100% { transform: scale(0.85) rotate(0deg); opacity: 0.4; }
  }

  /* Animaciones orgánicas para destellos SIE */
  @keyframes sparkleGaze {
    0% { transform: scale(0.72) rotate(0deg); opacity: 0.3; }
    50% { transform: scale(1.15) rotate(12deg); opacity: 0.9; filter: drop-shadow(0 0 8px rgba(166, 100, 190, 0.7)); }
    100% { transform: scale(0.72) rotate(0deg); opacity: 0.3; }
  }

  @keyframes sparkleTwinkle {
    0%, 100% { transform: scale(0.55) rotate(-6deg); opacity: 0.18; }
    40% { transform: scale(0.7) rotate(0deg); opacity: 0.35; }
    60% { transform: scale(1.22) rotate(20deg); opacity: 0.95; filter: drop-shadow(0 0 10px rgba(166, 100, 190, 0.85)); }
    80% { transform: scale(0.8) rotate(10deg); opacity: 0.4; }
  }

  @keyframes sparkleFloat {
    0% { transform: translate(0, 0) scale(0.8) rotate(0deg); opacity: 0.35; }
    50% { transform: translate(-3px, -5px) scale(1.12) rotate(-14deg); opacity: 0.85; filter: drop-shadow(0 0 6px rgba(146, 109, 146, 0.55)); }
    100% { transform: translate(0, 0) scale(0.8) rotate(0deg); opacity: 0.35; }
  }

  @keyframes shakeError {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
    40%, 60% { transform: translate3d(3px, 0, 0); }
  }

  /* ── RESPONSIVE DESIGN (320px, 360px, 768px, 1024px, 1440px) ── */
  @media (max-width: 960px) {
    .portal-stage {
      grid-template-columns: 1fr;
      max-width: 480px;
      gap: 32px;
    }

    .stage-intro {
      text-align: center;
      align-items: center;
      gap: 20px;
    }

    .return-nav {
      align-self: center;
    }

    .institution-badge {
      justify-content: center;
    }

    .feature-pillars {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .pillar-card {
      padding: 14px 18px;
    }

    .ambient-orbits {
      display: none;
    }

    /* En tablets y móviles, ocultar destellos periféricos para evitar saturación */
    .ambient-sparkle.s3,
    .ambient-sparkle.s5,
    .ambient-sparkle.s7,
    .ambient-sparkle.s8,
    .ambient-sparkle.s10,
    .ambient-sparkle.s11 {
      display: none;
    }

    .ambient-sparkle.s1 { top: 10%; left: 6%; width: 18px; height: 18px; opacity: 0.55; }
    .ambient-sparkle.s2 { bottom: 12%; left: 78%; width: 14px; height: 14px; opacity: 0.5; }
    .ambient-sparkle.s4 { top: 7%; left: 85%; width: 12px; height: 12px; opacity: 0.5; }
    .ambient-sparkle.s6 { top: 28%; left: 88%; width: 19px; height: 19px; opacity: 0.55; }
    .ambient-sparkle.s9 { bottom: 8%; left: 8%; width: 16px; height: 16px; opacity: 0.5; }
  }

  @media (max-width: 480px) {
    .ambient-sparkle.s2,
    .ambient-sparkle.s4 {
      display: none;
    }
    .portal-wrapper {
      padding: 22px 14px;
    }

    .auth-card {
      padding: 32px 20px 28px;
      border-radius: 20px;
    }

    .institution-name {
      font-size: 1.02rem;
    }

    .crest-frame {
      width: 52px;
      height: 52px;
      border-radius: 16px;
    }

    .auth-card-header h1 {
      font-size: 1.3rem;
    }

    input#email,
    input#password {
      height: 46px;
      font-size: 0.88rem;
    }

    button#submit-btn {
      height: 48px;
      font-size: 0.92rem;
    }

    .pillar-card {
      padding: 12px 14px;
      border-radius: 14px;
      gap: 12px;
    }

    .pillar-icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .pillar-icon-wrap svg {
      width: 18px;
      height: 18px;
    }

    .pillar-content h3 {
      font-size: 0.82rem;
    }

    .pillar-content p {
      font-size: 0.72rem;
    }
  }

  @media (max-width: 340px) {
    .portal-wrapper {
      padding: 16px 10px;
    }

    .auth-card {
      padding: 26px 14px 22px;
    }

    .institution-badge {
      flex-direction: column;
      text-align: center;
      gap: 8px;
    }
  }

  /* ── DISTRIBUCIÓN MÓVIL: formulario primero (solo celulares, sin duplicar DOM) ── */
  @media (max-width: 640px) {
    .portal-wrapper {
      justify-content: flex-start;
      padding-top: 16px;
      padding-bottom: 24px;
    }

    .portal-stage {
      gap: 14px;
    }

    /* La columna institucional cede sus hijos a la grilla para poder reordenarlos */
    .stage-intro {
      display: contents;
    }

    .return-nav {
      order: 1;
      justify-self: center;
      animation: entranceFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .stage-auth {
      order: 2;
    }

    .institution-badge {
      order: 3;
      justify-self: center;
      margin-top: 10px;
      margin-bottom: 0;
      gap: 12px;
      animation: entranceFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .feature-pillars {
      order: 4;
      justify-self: center;
      gap: 10px;
      animation: entranceFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    /* Cabecera del formulario más compacta */
    .auth-card-header {
      margin-bottom: 20px;
    }

    .auth-logo-badge {
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      padding: 8px;
    }

    form#login-form {

    }

    .auth-card-footer {

      padding-top: 14px;
    }

    /* Sección institucional secundaria compacta */
    .crest-frame {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      padding: 5px;
    }

    .institution-badge {
      text-align: left;
    }

    .pillar-card {
      padding: 10px 14px;
      text-align: left;
    }

    /* Destellos alejados del contenido */
    .ambient-sparkle.s6 { top: 4%; left: 90%; }
    .ambient-sparkle.s1 { top: 3%; left: 4%; }
  }

  @media (max-width: 480px) {
    .auth-card {
      padding: 26px 18px 22px;
    }
  }

  @media (max-width: 340px) {
    .portal-wrapper {
      padding-top: 12px;
    }

    .auth-card {
      padding: 22px 14px 18px;
    }

    .institution-badge {
      flex-direction: row;
      gap: 10px;
    }

    .institution-name {
      font-size: 0.95rem;
    }
  }

  /* ── RESPETO A PREFERS-REDUCED-MOTION ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
      transform: none !important;
    }
    .ambient-sparkle {
      animation: none !important;
      opacity: 0.45 !important;
      transform: none !important;
    }
  }

  /* Recuperación conservada del repositorio original */
  .auth-reset-btn { appearance:none; border:0; background:transparent; cursor:pointer; font:inherit; text-decoration:underline; text-underline-offset:3px; }
  .auth-reset-btn:focus-visible { outline:2px solid #59217C; outline-offset:4px; border-radius:4px; }
  #info { margin-top:10px; color:#573C72; font-size:.82rem; line-height:1.5; }
</style>
<link rel="stylesheet" href="interfaz.css?v=15">
<script src="config.js?v=5"></script>
</head>
<body class="pagina-login">

  <!-- Barra Superior Institucional Unificada -->
  <header class="header-nav-wrap">
    <nav class="sie-navbar" aria-label="Navegación principal">
      <div class="nav-left">
        <div class="nav-crest-wrap">
          <img src="imagenes/insignia.png" alt="Insignia Santa Teresa de Ávila">
        </div>
        <div class="nav-inst-titles">
          <span class="nav-inst-sub">CDEM</span>
          <span class="nav-inst-main">Santa Teresa de Ávila</span>
        </div>
        <div class="nav-brand-divider" aria-hidden="true"></div>
        <span class="nav-sie-acronym">SIE</span>
      </div>

      <div class="nav-header-actions">
        <a href="index.html" class="nav-header-btn" id="back-link">Inicio</a>
        <button type="button" class="btn-logout" id="btn-logout" onclick="cerrarSesion()" aria-label="Cerrar sesión" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar sesión</span>
        </button>
        <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- Lienzo Ambiental y Gráfica SIE -->


  <!-- Contenedor Maestro -->
  <div class="portal-wrapper">
    <main class="portal-stage">

      <!-- Consola de Autenticación (Card) -->
      <section class="stage-auth" aria-label="Formulario de Acceso de Profesores">
        <div class="auth-card">

          <!-- Encabezado de la Tarjeta -->
          <div class="auth-card-header">
            <div class="auth-logo-badge">
              <img src="imagenes/insignia.png" alt="Insignia Santa Teresa de Ávila">
            </div>
            <h1>Acceso Profesores</h1>
            <p>Ingresá tus credenciales docentes para ingresar al panel de gestión.</p>
          </div>

          <!-- Formulario Obligatorio (IDs funcionales intactos) -->
          <form id="login-form" novalidate="">

            <!-- Campo Correo -->
            <div class="field-group">
              <label for="email" class="field-label">
                <span>Correo Institucional</span>
              </label>
              <div class="input-control-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input type="email" id="email" required="" autocomplete="username" placeholder="ejemplo@santateresa.edu" spellcheck="false">
              </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="field-group">
              <label for="password" class="field-label">
                <span>Contraseña</span>
              </label>
              <div class="input-control-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="password" required="" autocomplete="current-password" placeholder="••••••••••••">
                <button type="button" class="toggle-password-btn" id="toggle-password" aria-label="Mostrar contraseña">
                  <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 10.5C5.5 15.5 18.5 15.5 22 10.5"></path>
                    <path d="M12 14.25v3.75"></path>
                    <path d="M8 13.5l-1.8 3.2"></path>
                    <path d="M16 13.5l1.8 3.2"></path>
                    <path d="M4.5 12l-2.2 2.5"></path>
                    <path d="M19.5 12l2.2 2.5"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" id="submit-btn">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-text">Ingresar al Sistema</span>
            </button>

            <!-- Contenedor Oficial de Mensajes de Error -->
            <div id="error" role="alert" aria-live="polite"></div>

          </form>

          <!-- Pie de Tarjeta Institucional -->
          <footer class="auth-card-footer">
            <button type="button" id="reset-btn" class="auth-hint auth-reset-btn">Definir o recuperar contraseña</button>
            <div id="info" role="status" aria-live="polite"></div>
            <div class="footer-legal"><a href="privacidad.html">Privacidad</a><a href="guia-de-uso.html">Guía de uso</a></div>
          </footer>

        </div>
      </section>

    </main>
  </div>

  <!-- SDK de Firebase (versión compat, requerida por el proyecto) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Lógica de Autenticación e Interactividad -->
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = submitBtn.querySelector('.btn-text');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    // Definición de iconos SVG estilizados (modo claro / morado institucional)
    const SVG_OJO_CERRADO = `
      <path d="M2 10.5C5.5 15.5 18.5 15.5 22 10.5"></path>
      <path d="M12 14.25v3.75"></path>
      <path d="M8 13.5l-1.8 3.2"></path>
      <path d="M16 13.5l1.8 3.2"></path>
      <path d="M4.5 12l-2.2 2.5"></path>
      <path d="M19.5 12l2.2 2.5"></path>
    `;

    const SVG_OJO_ABIERTO = `
      <path d="M2 13c3.5-5.5 16.5-5.5 20 0-3.5 5.5-16.5 5.5-20 0z"></path>
      <circle cx="12" cy="13" r="2.8" fill="currentColor"></circle>
      <path d="M12 7.5V3.8"></path>
      <path d="M8 8.5l-1.8-3.2"></path>
      <path d="M16 8.5l1.8-3.2"></path>
      <path d="M4.5 10.5l-2.2-2.5"></path>
      <path d="M19.5 10.5l2.2-2.5"></path>
    `;

    // Alternar visibilidad de contraseña con parpadeo animado
    if (togglePasswordBtn && eyeIcon && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';

        // Animación de parpadeo del párpado
        eyeIcon.classList.remove('blinking');
        void eyeIcon.offsetWidth;
        eyeIcon.classList.add('blinking');

        // Transición de párpados durante el punto medio del parpadeo
        setTimeout(() => {
          if (isPassword) {
            // Contraseña visible: ojo abierto con pupila y pestañas superiores (sin líneas diagonales)
            eyeIcon.innerHTML = SVG_OJO_ABIERTO;
            togglePasswordBtn.setAttribute('aria-label', 'Ocultar contraseña');
          } else {
            // Contraseña oculta: ojo cerrado con párpado curvado y pestañas inferiores
            eyeIcon.innerHTML = SVG_OJO_CERRADO;
            togglePasswordBtn.setAttribute('aria-label', 'Mostrar contraseña');
          }
        }, 120);

        setTimeout(() => {
          eyeIcon.classList.remove('blinking');
        }, 270);
      });
    }

    const btnLogout = document.getElementById('btn-logout');

    // Si ya hay sesión activa, mostrar botón de cerrar sesión y redirigir si el correo está verificado
    firebase.auth().onAuthStateChanged(user => {
      if (btnLogout) {
        btnLogout.hidden = !user;
      }
      if (user && user.emailVerified) {
        window.location.href = 'profesores.html';
      }
    });

    // Cerrar sesión desde la barra superior
    async function cerrarSesion() {
      try {
        if (typeof firebase !== 'undefined' && firebase.auth) {
          await firebase.auth().signOut();
        }
      } catch (e) {
        /* Ignorar error si no había sesión activa */
      }
      if (btnLogout) btnLogout.hidden = true;
      if (form) form.reset();
      if (errorBox) {
        errorBox.textContent = '';
        errorBox.classList.remove('active');
      }
      const info = document.getElementById('info');
      if (info) {
        info.textContent = 'Sesión cerrada correctamente.';
      }
    }

    // Envío del Formulario
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorBox.textContent = '';
      errorBox.classList.remove('active');
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      if (btnText) btnText.textContent = 'Ingresando...';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        const credencial = await firebase.auth().signInWithEmailAndPassword(email, password);
        if (!credencial.user.emailVerified) {
          await firebase.auth().signOut();
          throw { code: 'auth/email-not-verified' };
        }
        window.location.href = 'profesores.html';
      } catch (err) {
        errorBox.textContent = mensajeError(err.code);
        errorBox.classList.add('active');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        if (btnText) btnText.textContent = 'Ingresar al Sistema';
      }
    });

    // Recuperación de contraseña: lógica funcional del repositorio original.
    document.getElementById('reset-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const info = document.getElementById('info');
      errorBox.textContent = '';
      info.textContent = '';
      if (!email) {
        errorBox.textContent = 'Escribí tu correo arriba y volvé a tocar este botón.';
        return;
      }
      try {
        firebase.auth().languageCode = 'es';
        await firebase.auth().sendPasswordResetEmail(email);
      } catch (err) {
        if (err.code === 'auth/invalid-email') {
          errorBox.textContent = 'El correo no es válido.';
          return;
        }
        if (err.code === 'auth/too-many-requests') {
          errorBox.textContent = 'Demasiados intentos. Probá de nuevo en unos minutos.';
          return;
        }
      }
      info.textContent = 'Si el correo está registrado, te enviamos un enlace para elegir tu contraseña. Revisá también la carpeta de spam.';
    });

    // Mensajes de error en español amigables y precisos
    function mensajeError(code) {
      switch (code) {
        case 'auth/email-not-verified':
          return 'Tu correo todavía no está verificado. Contactá al administrador para habilitar tu cuenta.';
        case 'auth/invalid-email':
          return 'El correo electrónico no es válido.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          return 'Correo o contraseña incorrectos.';
        case 'auth/too-many-requests':
          return 'Demasiados intentos. Probá de nuevo en unos minutos.';
        case 'auth/network-request-failed':
          return 'Problema de conexión a internet. Verificá tu red.';
        default:
          return 'No se pudo iniciar sesión. Verificá los datos o probá de nuevo.';
      }
    }
  </script>


</body></html>
