<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso Profesores — CEDM Santa Teresa</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-login">
  <div class="box">
    <a href="index.html" style="display:inline-block; margin-bottom:14px; font-size:12px; color:#B9A9D9; text-decoration:none;">← Volver al inicio</a>
    <h1>Acceso Profesores</h1>
    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Ingresar</button>
      <div id="error"></div>
    </form>
  </div>

  <!-- SDK de Firebase (versión compat, simple, sin build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    // Si ya hay sesión activa, mandar directo a profesores.html
    firebase.auth().onAuthStateChanged(user => {
      if (user) window.location.href = 'profesores.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        window.location.href = 'profesores.html';
      } catch (err) {
        errorBox.textContent = mensajeError(err.code);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });

    function mensajeError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'El correo no es válido.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'Correo o contraseña incorrectos.';
        case 'auth/too-many-requests': return 'Demasiados intentos. Probá de nuevo en unos minutos.';
        default: return 'No se pudo iniciar sesión. Probá de nuevo.';
      }
    }
  </script>
</body>
</html>
