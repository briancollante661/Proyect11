<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Profesores — CEDM Santa Teresa de Avila</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
</head>
<body class="pagina-profesores">

<div class="form-wrap">
  <a href="index.html" style="display:inline-block; margin-bottom:14px; font-size:12px; color:#B9A9D9; text-decoration:none;">← Volver al inicio</a>
  <div class="form-title">Panel de Profesores</div>
  <div class="form-sub">Subí una tarea directamente al sistema.</div>

  <button onclick="cerrarSesion()">Cerrar sesión</button>

 <form id="form-aviso">
    <div class="campo">
      <label>Curso</label>
      <select id="aviso-curso" required>
        <option value="">Seleccioná un curso</option>
        <option value="general">General (todos los cursos)</option>
        <option value="primero">Primero</option>
        <option value="segundo">Segundo</option>
        <option value="tercero">Tercero</option>
      </select>
    </div>
    <div class="campo">
      <label>Tipo</label>
      <select id="aviso-tipo" required>
        <option value="evento">Evento</option>
        <option value="cambio_horario">Cambio de horario</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div class="campo">
      <label>Título</label>
      <input type="text" id="aviso-titulo" maxlength="100" required>
    </div>
    <div class="campo">
      <label>Descripción</label>
      <textarea id="aviso-descripcion" maxlength="1000" required></textarea>
    </div>
    <div class="campo">
      <label>Fecha del evento (opcional)</label>
      <input type="date" id="aviso-fecha-evento">
    </div>
    <div class="campo">
      <label>Vigente hasta (opcional)</label>
      <input type="date" id="aviso-vigente">
    </div>
    <button type="submit" class="btn-enviar" id="btn-aviso">Publicar aviso</button>
    <div class="estado-msg" id="estado-aviso"></div>
  </form>
    </div>
  
  <form id="form-tarea">
    <div class="campo">
      <label>Curso</label>
      <select id="curso" required>
        <option value="">Seleccioná un curso</option>
        <option value="Primero">Primero</option>
        <option value="Segundo">Segundo</option>
        <option value="Tercero">Tercero</option>
      </select>

        <hr style="margin:28px 0; border:0; border-top:1px solid rgba(255,255,255,.15);">
  <div class="form-title">Publicar aviso</div>

    <div class="campo">
      <label>Materia</label>
      <select id="materia" required disabled>
        <option value="">Seleccioná primero un curso</option>
      </select>
    </div>

    <div class="campo">
      <label>Título</label>
      <input type="text" id="titulo" required>
    </div>

    <div class="campo">
      <label>Descripción</label>
      <textarea id="descripcion"></textarea>
    </div>

    <div class="campo">
      <label>Fecha de entrega</label>
      <input type="date" id="entrega" required>
    </div>

    <div class="campo">
     <label>Archivos (opcional, podés elegir varios)</label>
      <input type="file" id="archivo" multiple>
    </div>

    <button type="submit" class="btn-enviar" id="btn-enviar">Subir tarea</button>
    <div class="estado-msg" id="estado-msg"></div>
  </form>
</div>


<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk5-MfbmPN82De2LmFkLPaeKI3IprTiYaRuCqo8yEvXwxrniq0QSPDrIokVvJMqhGWXw/exec";

const MATERIAS_POR_CURSO = {
  "Primero": [
    "Matemática", "Matemática aplicada", "Algoritmica", "Física", "Software",
    "Hardware", "Laboratorio", "Dibujo técnico", "Historia y geografía", "Ética",
    "Química", "Ciencias Naturales", "Educación física", "Guaraní", "Castellano",
    "Inglés", "Orientación"
  ],
  "Segundo": [
    "Matemática", "Matemática aplicada", "Algoritmica", "Laboratorio", "Mercadotecnia",
    "Administración Financiera", "Psicología", "Economía", "Orientación",
    "Ciencias Naturales", "Investigación social", "Historia y Geografía",
    "Castellano", "Educación física"
  ],
  "Tercero": [
    "Matemática", "Matemática aplicada", "Algoritmica", "Laboratorio", "Mercadotecnia",
    "Administración Financiera", "Economía", "Psicología", "Castellano",
    "Ciencias Naturales", "Orientación", "Investigación Social",
    "Historia y Geografía", "Educación Física"
  ]
};

const selCurso = document.getElementById("curso");
const selMateria = document.getElementById("materia");

selCurso.addEventListener("change", () => {
  const curso = selCurso.value;
  selMateria.innerHTML = "";

  if (!curso) {
    selMateria.disabled = true;
    selMateria.innerHTML = '<option value="">Seleccioná primero un curso</option>';
    return;
  }

  selMateria.disabled = false;
  selMateria.innerHTML = '<option value="">Seleccioná una materia</option>';
  MATERIAS_POR_CURSO[curso].forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    selMateria.appendChild(opt);
  });
});

function archivoABase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("form-tarea").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("btn-enviar");
  const msg = document.getElementById("estado-msg");
  msg.className = "estado-msg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Subiendo...";

  try {
     const archivoInput = document.getElementById("archivo");
    const archivos = Array.from(archivoInput.files);
    if (archivos.length > 3) throw new Error("Máximo 3 archivos por tarea.");
    if (archivos.some(f => f.size > 5 * 1024 * 1024)) throw new Error("Cada archivo debe pesar como máximo 5 MB.");
    if (archivos.reduce((s, f) => s + f.size, 0) > 10 * 1024 * 1024) throw new Error("Los archivos juntos no pueden superar 10 MB.");
          const datos = {
      curso: selCurso.value,
      materia: selMateria.value,
      titulo: document.getElementById("titulo").value,
      descripcion: document.getElementById("descripcion").value,
      entrega: document.getElementById("entrega").value
    };
    if (archivos.length) {
      datos.archivos = await Promise.all(archivos.map(async (f) => ({
        base64: await archivoABase64(f),
        nombre: f.name,
        tipo: f.type
      })));
    }
    const payload = {
      accion: "tareas.publicar",
      idToken: await firebase.auth().currentUser.getIdToken(),
      datos: datos
    };

    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();

    if (data.ok === true) {
      msg.className = "estado-msg ok";
      msg.textContent = "✓ Tarea subida correctamente.";
      document.getElementById("form-tarea").reset();
      selMateria.disabled = true;
      selMateria.innerHTML = '<option value="">Seleccioná primero un curso</option>';
    } else {
      if (data.codigo === "NO_AUTORIZADO") {
        window.location.href = "login.html";
        return;
      }
      throw new Error(data.error || "Error desconocido");
    }
  } catch (err) {
    msg.className = "estado-msg error";
    msg.textContent = "Ocurrió un error al subir la tarea: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Subir tarea";
  }
});

document.getElementById("form-aviso").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn-aviso");
  const msg = document.getElementById("estado-aviso");
  msg.className = "estado-msg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Publicando...";
  try {
    const payload = {
      accion: "avisos.publicar",
      idToken: await firebase.auth().currentUser.getIdToken(),
      datos: {
        curso: document.getElementById("aviso-curso").value,
        tipo: document.getElementById("aviso-tipo").value,
        titulo: document.getElementById("aviso-titulo").value,
        descripcion: document.getElementById("aviso-descripcion").value,
        fecha_evento: document.getElementById("aviso-fecha-evento").value,
        vigente_hasta: document.getElementById("aviso-vigente").value
      }
    };
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
        if (data.ok === true) {
      msg.className = "estado-msg ok";
      msg.textContent = "✓ Aviso publicado correctamente.";
      document.getElementById("form-aviso").reset();
      cargarAvisosActivos();
    } else {
      if (data.codigo === "NO_AUTORIZADO") {
        window.location.href = "login.html";
        return;
      }
      throw new Error(data.error || "Error desconocido");
    }
  } catch (err) {
    msg.className = "estado-msg error";
    msg.textContent = "Ocurrió un error al publicar el aviso: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Publicar aviso";
  }
});

async function cargarAvisosActivos() {
  const cont = document.getElementById("lista-avisos");
  cont.textContent = "Cargando...";
  try {
    const filas = (await cargarHoja(SHEETS_CONFIG.avisos.spreadsheetId, SHEETS_CONFIG.avisos.hoja))
      .filter(f => f.estado === "activo")
      .sort((a, b) => b.publicado_en.localeCompare(a.publicado_en));
    cont.textContent = "";
    if (!filas.length) { cont.textContent = "No hay avisos activos."; return; }
    filas.forEach(f => {
      const fila = document.createElement("div");
      fila.style.cssText = "display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0;";
      const txt = document.createElement("span");
      txt.textContent = "[" + f.curso + "] " + f.titulo + " — " + f.autor_nombre;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Retirar";
      b.addEventListener("click", () => retirarAviso(f.id, b));
      fila.append(txt, b);
      cont.appendChild(fila);
    });
  } catch (e) {
    cont.textContent = "No se pudieron cargar los avisos.";
  }
}

async function retirarAviso(id, btn) {
  if (!confirm("¿Retirar este aviso?")) return;
  const msg = document.getElementById("estado-retiro");
  msg.className = "estado-msg";
  msg.textContent = "";
  btn.disabled = true;
  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        accion: "avisos.retirar",
        idToken: await firebase.auth().currentUser.getIdToken(),
        datos: { id: id }
      })
    });
    const data = await resp.json();
    if (data.ok === true) {
      msg.className = "estado-msg ok";
      msg.textContent = "✓ Aviso retirado.";
      await cargarAvisosActivos();
    } else {
      if (data.codigo === "NO_AUTORIZADO") { window.location.href = "login.html"; return; }
      throw new Error(data.error || "Error desconocido");
    }
  } catch (err) {
    msg.className = "estado-msg error";
    msg.textContent = "No se pudo retirar: " + err.message;
    btn.disabled = false;
  }
}

cargarAvisosActivos();
</script>
</body>
</html>
